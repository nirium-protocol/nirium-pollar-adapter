name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (@pollar/core ${{ matrix.pollar-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the peer range (>=0.11.4 <0.13.0), so the contract test
        # really runs against each version the README says it supports.
        pollar-core: ['0.11.4', '0.12.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install @pollar/core ${{ matrix.pollar-core }}
        run: |
          npm install --no-save --no-audit --no-fund "@pollar/core@${{ matrix.pollar-core }}"
          node -e "const v=require('./node_modules/@pollar/core/package.json').version; if (v !== '${{ matrix.pollar-core }}') { console.error('expected ${{ matrix.pollar-core }}, got ' + v); process.exit(1) } console.log('@pollar/core', v)"
      - run: npm run typecheck
      - run: npm test
  # The dependency audit moved to security-gate.yml, next to the secret scan.
